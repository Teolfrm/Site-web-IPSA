<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Éclatée du Sous-marin (Three.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b1d3a; /* Fond bleu océan */
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        /* Style pour le curseur d'éclatement */
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input[type=range] {
            width: 200px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Interface utilisateur pour contrôler l'éclatement -->
    <div id="ui-container">
        <label for="explosionSlider"><strong>Vue Éclatée</strong></label><br>
        <input type="range" id="explosionSlider" min="0" max="1" step="0.01" value="0">
    </div>

    <!-- Importation de Three.js et du chargeur GLTF via un Import Map (recommandé) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Configuration de la scène, de la caméra et du renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 150, 500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ajout des contrôles de la caméra (permet de tourner autour du sous-marin avec la souris)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Éclairage de la scène
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(200, 400, 300);
        scene.add(directionalLight);

        // 2. Variables pour les pièces du sous-marin
        let submarineParts = [];
        const maxDistance = 250; // Distance maximale d'éloignement des pièces

        // Vecteurs de direction d'éclatement pour les composants du sous-marin
        const explosionDirections = [
            new THREE.Vector3(0, 0, 0),     // Node1 (Centre / Coque)
            new THREE.Vector3(0, 1, 0),     // Node2 (Tourelle / Haut)
            new THREE.Vector3(-1, 0, 0),    // Node3 (Flanc gauche)
            new THREE.Vector3(1, 0, 0),     // Node4 (Flanc droit)
            new THREE.Vector3(0, 0, -1),    // Node5 (Arrière / Propulseur)
            new THREE.Vector3(0, -1, 0)     // Node6 (Quille / Bas)
        ];

        // 3. Chargement du fichier GLB
        const loader = new GLTFLoader();
        // Remplacez 'votre_sous_marin.glb' par le chemin réel de votre fichier
        loader.load('votre_sous_marin.glb', function (gltf) {
            const model = gltf.scene;
            scene.add(model);

            let index = 0;
            model.traverse((child) => {
                if (child.isMesh || child.name.startsWith('Node')) {
                    submarineParts.push({
                        object: child,
                        originPosition: child.position.clone(),
                        direction: explosionDirections[index % explosionDirections.length]
                    });
                    index++;
                }
            });

            console.log("Modèle chargé ! Nombre de pièces détectées :", submarineParts.length);
        }, undefined, function (error) {
            console.error('Erreur lors du chargement du fichier GLB :', error);
        });

        // 4. Fonction de mise à jour de l'éclatement
        function updateExplosion(value) {
            submarineParts.forEach((part) => {
                const dir = part.direction;
                part.object.position.x = part.originPosition.x + (dir.x * value * maxDistance);
                part.object.position.y = part.originPosition.y + (dir.y * value * maxDistance);
                part.object.position.z = part.originPosition.z + (dir.z * value * maxDistance);
            });
        }

        // Lier le curseur HTML à la fonction d'éclatement
        const slider = document.getElementById('explosionSlider');
        slider.addEventListener('input', (event) => {
            updateExplosion(parseFloat(event.target.value));
        });

        // Gestion du redimensionnement de la fenêtre
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. Boucle d'animation principale
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
