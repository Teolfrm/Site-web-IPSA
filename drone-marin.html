<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Marin — Téo Leferme</title>
    <link rel="stylesheet" href="./style.css">
    
    <!-- Script Google Model-Viewer pour la 3D (Vérifiez si une version plus récente est dispo, ex: v4.0.0) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <!-- Styles spécifiques bleu IPSA (#00a8ff), galerie, et contrôles 3D -->
    <style>
        :root {
            --ipsa-blue: #00a8ff;
            --ipsa-blue-hover: #0086cc;
            --bg-dark: #0d1117;
            --border-dark: #30363d;
            --text-white: #ffffff;
        }

        .card-tag {
            background: rgba(0, 168, 255, 0.15) !important;
            color: var(--ipsa-blue) !important;
        }
        .card:hover {
            border-color: var(--ipsa-blue) !important;
        }
        .btn-contact {
            background-color: var(--ipsa-blue) !important;
            color: var(--text-white) !important;
        }
        .btn-contact:hover {
            background-color: var(--ipsa-blue-hover) !important;
        }

        /* --- STYLES GALERIE 2 IMAGES --- */
        .gallery-section {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            overflow: hidden;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
